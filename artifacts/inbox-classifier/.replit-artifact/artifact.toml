kind = "web"
previewPath = "/"
title = "Inbox Classifier"
description = "A privacy-conscious Gmail organizer that uses AI to classify inbox metadata into labels, reviewable categories, and actionable summaries without storing email bodies."
version = "1.0.0"
id = "artifacts/inbox-classifier"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22687

[services.development]
run = "pnpm --filter @workspace/inbox-classifier run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/inbox-classifier", "run", "build" ]
serve = "static"
publicDir = "artifacts/inbox-classifier/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22687"
BASE_PATH = "/"
